<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Futures AI Scanner</title><style>body{margin:0;background:#0b1322;color:#e9edf6;font-family:Tahoma,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{color:#d7ae63}.muted{color:#99a7be}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.card{background:#172238;border:1px solid #28364d;border-radius:14px;padding:20px}.long{color:#4ade80}.short{color:#fb7185}button{background:#d7ae63;color:#101827;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold}input{background:#172238;color:white;padding:10px;border:1px solid #3b4b61;border-radius:7px;width:90px}small{color:#a9b4c6}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}strong{font-size:19px}#status{margin:16px 0}</style></head><body><main><header><div><h1>Futures AI Scanner</h1><p class="muted">Binance USDT-M · Scalping · إشارات تحليلية فقط</p></div><div><label>حد الفرص <input id="limit" type="number" min="1" max="30" value="10"></label> <button id="scan">فحص السوق</button></div></header><p id="status" class="muted">اضغط فحص السوق لبدء التحليل الفعلي.</p><section class="cards" id="cards"></section><p class="muted">تنبيه: هذه فرص فنية مبدئية وليست توصيات مؤكدة. لا تشمل الرسوم أو السبريد أو الانزلاق السعري. لا توجد أوامر تداول.</p></main><script>const api='';const btn=document.getElementById('scan'),status=document.getElementById('status'),cards=document.getElementById('cards');btn.onclick=async()=>{btn.disabled=true;status.textContent='جارٍ فحص العقود... قد يستغرق ذلك عدة دقائق.';cards.replaceChildren();try{const n=Math.min(30,Math.max(1,Number(document.getElementById('limit').value)||10));const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),180000);let r;try{r=await fetch(api+'/api/opportunities?limit='+n,{signal:controller.signal})}finally{clearTimeout(timer)};if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();status.textContent=`تم فحص ${d.scanned} عقد · ${d.matched} فرصة مطابقة · آخر تحديث ${new Date(d.timestamp).toLocaleTimeString('ar-EG')}`;for(const x of d.opportunities){const div=document.createElement('article');div.className='card';const lines=[[x.symbol,x.side],["التقييم",x.score+'/100'],['دخول مرجعي',x.entry],['وقف خسارة نظري',x.stop],['هدف نظري',x.takeProfit],['RSI',x.rsi],['حجم نسبي',x.volumeRatio],['إغلاق آخر شمعة',new Date(x.time).toLocaleString('ar-EG')]];for(const [a,b] of lines){const p=document.createElement('p');p.textContent=a+' : '+b;if(a===x.symbol)p.className=x.side==='LONG'?'long':'short';div.append(p)}cards.append(div)}if(!d.opportunities.length)cards.textContent='لا توجد فرص مطابقة للشروط حاليًا.'}catch(e){status.textContent='فشل جلب البيانات: '+(e.name==='AbortError'?'انتهت مهلة الفحص':e.message)+' — تحقق من اتصال الخادم بـ Binance ثم حاول مجددًا.'}finally{btn.disabled=false}};</script></body></html>
